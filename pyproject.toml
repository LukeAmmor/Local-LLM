[project]
name = "local-llm-rag"
version = "0.1.0"
description = "Private local LLM knowledge assistant (RAG) with access control"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "FlagEmbedding>=1.4.2",      # bge-m3 (dense + sparse) and bge-reranker-v2-m3
    "transformers>=5.0,<6.0",    # tokenizer for token-based chunking (also used by FlagEmbedding)
    "qdrant-client>=1.20.0",     # vector database client
    "httpx>=0.28.1",             # HTTP: Ollama REST API + document downloads
    "pydantic>=2.10",
    "pydantic-settings>=2.16",   # one settings class, overridable from .env
]

# PyTorch must come from the PyTorch package index, not PyPI. It is chosen with
# a dependency group, and `cu130` is the default group, so on the dev machine
# plain `uv sync` / `uv run` install and keep the CUDA build.
#   Windows dev machine (RTX 5060, Blackwell):  uv sync
#   Linux server without GPU:                   uv sync --no-default-groups --group cpu
[dependency-groups]
dev = ["pytest>=9.2"]
cu130 = ["torch==2.14.1"]
cpu = ["torch==2.14.1"]

[tool.uv]
default-groups = ["dev", "cu130"]
conflicts = [[{ group = "cpu" }, { group = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# The Python package `app` lives in backend/app. Installing the project makes
# `python -m app.<module>` work from the repository root.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
