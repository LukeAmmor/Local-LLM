# Document manifest: the single list of documents the assistant knows about.
#
# Fields
#   id               unique, stable identifier (used in chunk ids and the test set)
#   title            shown in citations
#   path             file location relative to data/raw/ (always <department>/<file>)
#   department       owning department: procurement | hr | it-security | public
#   language         declared language of the document: en | fr | ar
#   allowed_groups   groups allowed to read it; "public" = everyone
#   source_url       where the file comes from (direct file, or the source page)
#   manual_download  true when the file cannot be downloaded by the script
#                    (source_url is a web page, or the site refuses scripts):
#                    put the file at data/raw/<path> by hand; `python -m app.download`
#                    skips it if it is there and reminds you if it is missing
#   exclude          optional reason to keep the document out of the index; the
#                    file is still checked by `python -m app.download` (findings
#                    in docs/corpus.md)
#   split            train | test for embedder fine-tuning (decided in Phase 6)

documents:
